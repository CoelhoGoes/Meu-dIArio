<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Diário com IA</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="main-container">
            <h1>Meu Diário Online</h1>
            <p>Escreva suas notas e use a IA para te ajudar a organizar e criar.</p>

            <textarea class="main-editor" placeholder="Comece a escrever aqui..."></textarea>

            <button id="open-ai-btn" class="ai-button">
                Falar com IA ✨
            </button>

            <div id="ai-chat-container" class="ai-chat-container hidden">
                <div class="ai-chat-header">
                    <h2>Assistente de Escrita</h2>
                    <button id="close-ai-btn" class="close-button">&times;</button>
                </div>
                <div class="ai-chat-body">
                    <textarea id="ai-prompt-input" placeholder="Peça ajuda à IA. Ex: 'Me ajude a organizar essa anotação em tópicos' ou 'Continue essa história...'"></textarea>
                    <button id="submit-ai-prompt" class="submit-button">Enviar</button>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
